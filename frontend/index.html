<!DOCTYPE html>
<!--
  메챠 카멜레온 찾기 - 프론트엔드 (백엔드는 app.py)
  사용법: ① python frontend/app.py 실행 → http://127.0.0.1:8000 접속 (권장)
          ② 파일을 더블클릭해 열어도 동작 (이때는 로컬 8000번 서버로 접속)
          ③ 외부 서버(ngrok 등)를 쓰면 아래 API_URL 규칙 참고
  이 화면은 백엔드가 주는 JSON 값만 받아서 그립니다. (YOLO·점수 계산은 전부 서버)
  구성: ① <style> 디자인  ② <body> 화면 구조  ③ <script> 동작
-->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>메챠 카멜레온 찾기</title>

<!-- ① 디자인(CSS) -->
<style>
:root{
  --green:#3f5c2b; --or:#e0682d; --bg:#f4f1ea; --card:#fbfaf6;
  --tx:#1f2a1f; --mut:#5d6b55; --ln:#cfc9b6;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.5}
.wrap{max-width:860px;margin:0 auto;padding:24px 20px}
.tag{color:var(--or);font-weight:700;font-size:14px;margin:0}
h1{font-size:clamp(32px,6vw,48px);line-height:1.15;margin:8px 0 10px}
h2{margin:4px 0 14px}
.sub{color:var(--mut);margin:0 0 18px}
.info{font-size:13px;color:var(--mut)}
.btn{display:inline-block;border:2px solid var(--green);background:var(--green);color:#fff;padding:11px 26px;border-radius:999px;font:inherit;font-weight:700;cursor:pointer;text-decoration:none;margin:0 8px 8px 0}
.btn.ghost{background:transparent;color:var(--green)}
.btn.or{background:var(--or);border-color:var(--or)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.drop{border:3px dashed var(--ln);border-radius:18px;background:var(--card);padding:28px;text-align:center;cursor:pointer}
.drop.over{border-color:var(--or);background:rgba(224,104,45,.08)}
.panel{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:16px}
.preview{position:relative;line-height:0;border-radius:14px;overflow:hidden}
.preview img{width:100%;max-height:62vh;object-fit:contain;display:block}
.err{color:#c0392b;font-weight:700;min-height:24px;margin:8px 0}

/* AI가 찾은 박스: 가장 확실한 1개는 주황, 나머지는 초록 */
.bb{position:absolute;border:3px dashed var(--or)}
.bb.sub{border:2px dashed #6b8350}
.bb span{position:absolute;left:-3px;bottom:100%;background:var(--or);color:#fff;font-size:12px;font-weight:700;padding:2px 8px;line-height:1.5;white-space:nowrap}
.bb.sub span{background:#6b8350}

.res{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:720px){.res{grid-template-columns:1fr}}
.score{font-size:72px;font-weight:300;color:var(--green);line-height:1}
.badge{display:inline-block;background:var(--or);color:#fff;font-weight:700;border-radius:999px;padding:4px 14px;font-size:14px;margin:8px 0 12px}
.row{margin:6px 0;font-size:14px}
.row b{display:inline-block;width:84px}
.row span{color:var(--mut)}
.found{margin:10px 0;padding:10px 12px;border-radius:10px;background:rgba(107,131,80,.12);font-size:14px}
.found.miss{background:rgba(224,104,45,.12)}
.spin{display:inline-block;width:16px;height:16px;border:3px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:r .8s linear infinite;vertical-align:-3px;margin-right:6px}
@keyframes r{to{transform:rotate(360deg)}}
</style>
</head>

<!-- ② 화면 구조(HTML) -->
<body>
<div class="wrap">

  <!-- 화면 1: 사진 올리기 -->
  <section id="upload" class="view">
    <p class="tag">YOLO 기반 위장 숨바꼭질</p>
    <h1>숨긴 사진을 올려<br>AI에게 들켜 보세요</h1>
    <p class="sub">캐릭터를 배경에 숨긴 사진을 올리고 제출하면, AI가 찾아서 점수를 매겨 줍니다.</p>

    <div class="drop" id="drop">
      <div style="font-size:40px">📷</div>
      <p style="margin:6px 0;font-weight:700">사진을 끌어다 놓거나 눌러서 선택하세요</p>
      <p class="info" style="margin:0">JPG · PNG · WEBP, 최대 10MB</p>
      <input type="file" id="file" accept="image/jpeg,image/png,image/webp" hidden>
    </div>

    <div id="pv" hidden style="margin-top:16px">
      <div class="panel">
        <div class="preview"><img id="img" alt="미리보기"></div>
        <p class="info" id="meta" style="margin:10px 0 0"></p>
      </div>
    </div>

    <div class="err" id="err"></div>
    <button class="btn or" id="submit" disabled>제출하고 평가받기</button>
    <button class="btn ghost" id="clear" hidden>사진 바꾸기</button>
  </section>

  <!-- 화면 2: 결과 -->
  <section id="result" class="view" hidden>
    <p class="tag">결과</p>
    <h2>평가받기</h2>
    <div class="panel res">
      <div>
        <div class="preview" id="shot"></div>
        <svg id="radar" viewBox="0 0 320 300" style="width:100%"></svg>
      </div>
      <div>
        <span class="score" id="score">0</span> <span class="info">/ 100점</span><br>
        <span class="badge" id="title"></span>
        <div class="found" id="found"></div>
        <div id="cm"></div>
        <p class="info" id="note"></p>
        <a class="btn" href="#upload">다시 도전</a>
      </div>
    </div>
  </section>

</div>

<!-- ③ 동작(JavaScript) -->
<script>
/* ★ 설정 ★ */
// app.py 가 이 페이지를 직접 서빙하므로 기본값은 같은 주소의 '/detect' 입니다.
//   - 파일을 더블클릭해 열었을 때(file://)는 로컬 서버(8000번)로 접속
//   - 외부 서버(ngrok 등)를 쓸 때는 window.MECCHA_API_URL 에 전체 주소를 지정
//     예) window.MECCHA_API_URL = 'https://xxxx.ngrok-free.app/detect'; 를 먼저 지정
const API_URL = window.MECCHA_API_URL
  ? window.MECCHA_API_URL
  : (location.protocol === 'file:'
      ? 'http://localhost:8000/detect'
      : new URL('/detect', location.origin).toString());
const TIMEOUT_SEC = 60;       // YOLO가 오래 걸려도 이 시간까지 기다림
const USE_MOCK = false;       // true: 서버 없이 가짜 결과로 화면만 확인 / false: 실제 서버 사용

const MAX_MB = 10;
const OK = ['image/jpeg','image/png','image/webp'];
const $ = id => document.getElementById(id);
let file = null, objUrl = null, state = {};

/* --- 1. 사진 선택 (클릭 / 드래그) --- */
const drop = $('drop'), inp = $('file');
drop.onclick = () => inp.click();
inp.onchange = () => pick(inp.files[0]);
['dragenter','dragover'].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave','drop'].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', e => pick(e.dataTransfer.files[0]));

function pick(f){
  $('err').textContent = '';
  if (!f) return;
  if (!OK.includes(f.type)) { $('err').textContent = 'JPG, PNG, WEBP 사진만 올릴 수 있어요.'; return; }
  if (f.size > MAX_MB*1024*1024) { $('err').textContent = `사진이 너무 커요. ${MAX_MB}MB 이하로 올려 주세요.`; return; }
  file = f;
  if (objUrl) URL.revokeObjectURL(objUrl);
  objUrl = URL.createObjectURL(f);
  const im = $('img'); im.src = objUrl;
  im.onload = () => {
    state.w = im.naturalWidth; state.h = im.naturalHeight;
    $('meta').textContent = `${f.name} · ${state.w}×${state.h} · ${(f.size/1048576).toFixed(1)}MB`;
  };
  $('pv').hidden = false; drop.hidden = true;
  $('clear').hidden = false; $('submit').disabled = false;
}

$('clear').onclick = () => {
  file = null; inp.value = '';
  $('pv').hidden = true; drop.hidden = false;
  $('clear').hidden = true; $('submit').disabled = true; $('err').textContent = '';
};

/* --- 2. 제출 (서버로 사진 보내기) --- */
$('submit').onclick = async () => {
  if (!file) return;
  const b = $('submit');
  b.disabled = true; b.innerHTML = '<span class="spin"></span>AI가 찾는 중…';
  $('err').textContent = '';
  let data;
  try {
    if (USE_MOCK) {
      await new Promise(r => setTimeout(r, 900));
      data = mockResult();
    } else {
      const fd = new FormData();
      fd.append('image', file);                       // 서버에서는 'image' 이름으로 받음
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), TIMEOUT_SEC * 1000);
      try {
        const res = await fetch(API_URL, {
          method: 'POST', body: fd, signal: ctrl.signal,
          headers: { 'ngrok-skip-browser-warning': 'true' }   // ngrok 무료 주소 사용 시 필요
        });
        if (!res.ok) {                                        // 실패: 서버가 준 error.message 사용
          let msg = '분석에 실패했어요 (HTTP ' + res.status + ')';
          try {
            const err = await res.json();
            if (err && err.error && err.error.message) msg = err.error.message;
          } catch (_) { /* JSON이 아니면 기본 문구 */ }
          throw new Error(msg);
        }
        data = await res.json();                              // Score response 스키마
      } finally { clearTimeout(timer); }
    }
  } catch (e) {
    // 실패하면 가짜 결과로 덮지 않고, 서버가 준 error.message(또는 연결 오류 안내)를 보여줌
    let msg = e.message || '알 수 없는 오류가 났어요.';
    if (e.name === 'AbortError') {
      msg = `서버 응답이 ${TIMEOUT_SEC}초 안에 오지 않았어요. 잠시 후 다시 시도해 주세요.`;
    } else if (e.name === 'TypeError' || /failed to fetch|networkerror|load failed/i.test(msg)) {
      msg = '서버에 연결하지 못했어요. 서버가 켜져 있는지, 주소가 맞는지 확인해 주세요.';
    }
    $('err').textContent = msg;
    b.disabled = false; b.textContent = '제출하고 평가받기';
    return;
  }
  state.data = data; state.src = objUrl;
  b.disabled = false; b.textContent = '제출하고 평가받기';
  location.hash = 'result';
};

/* 서버 응답과 같은 형식의 임시 데이터 (USE_MOCK = true 일 때만 사용)
   구조는 schemas/examples/response_found.json 과 같습니다. */
function mockResult(){
  const w = state.w || 1390, h = state.h || 781;
  return {
    schema_version: '0.1',
    found: true,
    image: { width: w, height: h },
    detection: { bbox: [w*.30, h*.22, w*.39, h*.39], confidence: 0.87 },
    total_score: 50,
    title: '아쉬운 견습 카멜레온',
    abilities: [
      { key:'evasion',       label:'탐지 회피',   score:13, comment:'AI가 바로 찾았어요.' },
      { key:'color_blend',   label:'색 동화',     score:72, comment:'주변 색과 잘 어울려요.' },
      { key:'texture_blend', label:'질감 동화',   score:58, comment:'무늬가 조금 튀어요.' },
      { key:'exposure',      label:'노출 크기',   score:40, comment:'몸이 꽤 크게 보여요.' },
      { key:'clutter',       label:'배경 복잡도', score:66, comment:'복잡한 곳을 잘 골랐어요.' }
    ],
    elapsed_sec: null,
    meta: { model:'mock', inference_ms:null, conf_threshold:0.25 }
  };
}

/* --- 3. 결과 그리기 (서버 응답 = docs/score-schema.md 3장 형식) --- */
// 능력치 화면 이름은 프론트가 key 로 정합니다. (label 은 서버의 임시 이름)
const AXIS_NAME = {
  evasion:'탐지 회피', color_blend:'색 동화', texture_blend:'질감 동화',
  exposure:'노출 크기', clutter:'배경 복잡도', find_difficulty:'발견 난이도'
};
const axisName = a => AXIS_NAME[a.key] || a.label || a.key;
const axisScoreText = a => a.score == null ? '-' : a.score;

function renderResult(){
  const d = state.data;
  if (!d) { location.hash = 'upload'; return; }

  // 원본 사진 크기: 박스를 % 위치로 그릴 때 사용
  const W = (d.image && d.image.width) || state.w || 1;
  const H = (d.image && d.image.height) || state.h || 1;
  const det = d.found ? d.detection : null;      // 대표 박스 1개 (못 찾으면 null)

  // 사진 + 박스 (found=false 이면 그리지 않음)
  const s = $('shot'); s.innerHTML = '';
  const im = document.createElement('img');
  im.src = state.src; im.style.cssText = 'width:100%;display:block'; s.appendChild(im);
  if (det && det.bbox) {
    const [x1, y1, x2, y2] = det.bbox;
    const bx = document.createElement('div');
    bx.className = 'bb';
    bx.style.cssText = `left:${x1/W*100}%;top:${y1/H*100}%;width:${(x2-x1)/W*100}%;height:${(y2-y1)/H*100}%`;
    const label = det.confidence == null ? '탐지' : '탐지 신뢰도 ' + Number(det.confidence).toFixed(2);
    bx.innerHTML = `<span>${label}</span>`;
    s.appendChild(bx);
  }

  // 점수·칭호 (null 이면 '-' 로 표시하고 칭호는 숨김)
  $('score').textContent = d.total_score == null ? '-' : d.total_score;
  $('title').textContent = d.title || '';
  $('title').hidden = !d.title;

  // 찾음 / 못 찾음 안내
  $('found').classList.toggle('miss', !d.found);
  $('found').textContent = d.found
    ? (det && det.confidence != null
        ? `AI가 캐릭터를 찾았어요. 탐지 신뢰도 ${Number(det.confidence).toFixed(2)}`
        : 'AI가 캐릭터를 찾았어요.')
    : 'AI가 캐릭터를 찾지 못했어요. 정말 잘 숨었거나, 사진에 캐릭터가 없을 수도 있어요.';

  // 능력치 목록 (배열 순서 = 차트 순서, score=null 이면 '-')
  const ab = Array.isArray(d.abilities) ? d.abilities : [];
  $('cm').innerHTML = ab.map(a =>
    `<div class="row"><b>${axisName(a)}</b><span>${axisScoreText(a)}${a.comment ? ' · ' + a.comment : ''}</span></div>`
  ).join('');

  // 오각형 그래프: null 은 0 으로 그리고 숫자는 '-' 로 표시
  $('radar').hidden = ab.length < 3;
  if (ab.length >= 3) {
    const cx = 160, cy = 150, R = 105;
    const v = ab.map(a => a.score == null ? 0 : Math.max(0, Math.min(100, a.score)));
    const pts = f => ab.map((_, i) => { const t = -Math.PI/2 + i*2*Math.PI/ab.length; return [cx+Math.cos(t)*R*f, cy+Math.sin(t)*R*f]; });
    let g = '';
    [.25,.5,.75,1].forEach(f => g += `<polygon points="${pts(f).join(' ')}" fill="none" stroke="#cfc9b6"/>`);
    const dp = pts(1).map((q,i) => [cx+(q[0]-cx)*v[i]/100, cy+(q[1]-cy)*v[i]/100]);
    g += `<polygon points="${dp.join(' ')}" fill="rgba(107,131,80,.4)" stroke="#3f5c2b" stroke-width="2.5"/>`;
    dp.forEach(q => g += `<circle cx="${q[0]}" cy="${q[1]}" r="4" fill="#3f5c2b"/>`);
    pts(1.22).forEach((q,i) => g += `<text x="${q[0]}" y="${q[1]}" text-anchor="middle" font-size="12" fill="#1f2a1f">${axisName(ab[i])} ${axisScoreText(ab[i])}</text>`);
    $('radar').innerHTML = g;
  }

  // 서버 meta 는 화면에 쓰지 않음. Mock 모드일 때만 안내.
  $('note').textContent = USE_MOCK ? '※ 가짜 결과(USE_MOCK)를 보여주고 있어요.' : '';
}

/* --- 4. 화면 전환 (주소 뒤 #upload / #result) --- */
function route(){
  const h = location.hash.slice(1) === 'result' ? 'result' : 'upload';
  document.querySelectorAll('.view').forEach(e => e.hidden = e.id !== h);
  if (h === 'result') renderResult();
  window.scrollTo(0, 0);
}
addEventListener('hashchange', route);
route();
</script>
</body>
</html>
