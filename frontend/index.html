<!DOCTYPE html>
<!--
  메챠 카멜레온 찾기 - 프론트엔드 (GitHub Pages용, 백엔드는 별도 서버)
  사용법: ① 아래 <script> 맨 위 API_URL 을 백엔드 서버 주소로 바꾸기
          ② 이 파일을 GitHub에 올리기 (더블클릭해서 열어도 동작)
  이 화면은 백엔드가 주는 JSON 값만 받아서 그립니다. (YOLO·점수 계산은 전부 서버)
  지원 형식: ① 점수 스키마 v0.1  ② 예전 형식(app.py: objects/bbox/abilities 딕셔너리) - 자동 판별
  구성: ① <style> 디자인  ② <body> 화면 구조  ③ <script> 동작
-->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>메챠 카멜레온 찾기</title>

<!-- ① 디자인(CSS) -->
<style>
:root{
  --green:#3f5c2b; --or:#e0682d; --bg:#f4f1ea; --card:#fbfaf6;
  --tx:#1f2a1f; --mut:#5d6b55; --ln:#cfc9b6;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.5}
.wrap{max-width:860px;margin:0 auto;padding:24px 20px}
.tag{color:var(--or);font-weight:700;font-size:14px;margin:0}
h1{font-size:clamp(32px,6vw,48px);line-height:1.15;margin:8px 0 10px}
h2{margin:4px 0 14px}
.sub{color:var(--mut);margin:0 0 18px}
.info{font-size:13px;color:var(--mut)}
.btn{display:inline-block;border:2px solid var(--green);background:var(--green);color:#fff;padding:11px 26px;border-radius:999px;font:inherit;font-weight:700;cursor:pointer;text-decoration:none;margin:0 8px 8px 0}
.btn.ghost{background:transparent;color:var(--green)}
.btn.or{background:var(--or);border-color:var(--or)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.drop{border:3px dashed var(--ln);border-radius:18px;background:var(--card);padding:28px;text-align:center;cursor:pointer}
.drop.over{border-color:var(--or);background:rgba(224,104,45,.08)}
.panel{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:16px}
.preview{position:relative;line-height:0;border-radius:14px;overflow:hidden}
.preview img{width:100%;max-height:62vh;object-fit:contain;display:block}
.err{color:#c0392b;font-weight:700;min-height:24px;margin:8px 0}

/* AI가 찾은 박스: 가장 확실한 1개는 주황, 나머지는 초록 */
.bb{position:absolute;border:3px dashed var(--or)}
.bb.sub{border:2px dashed #6b8350}
.bb span{position:absolute;left:-3px;bottom:100%;background:var(--or);color:#fff;font-size:12px;font-weight:700;padding:2px 8px;line-height:1.5;white-space:nowrap}
.bb.sub span{background:#6b8350}

.res{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:720px){.res{grid-template-columns:1fr}}
.score{font-size:72px;font-weight:300;color:var(--green);line-height:1}
.badge{display:inline-block;background:var(--or);color:#fff;font-weight:700;border-radius:999px;padding:4px 14px;font-size:14px;margin:8px 0 12px}
.row{margin:6px 0;font-size:14px}
.row b{display:inline-block;width:100px}
.row span{color:var(--mut)}
.found{margin:10px 0;padding:10px 12px;border-radius:10px;background:rgba(107,131,80,.12);font-size:14px}
.spin{display:inline-block;width:16px;height:16px;border:3px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:r .8s linear infinite;vertical-align:-3px;margin-right:6px}
@keyframes r{to{transform:rotate(360deg)}}

/* ✨ 애니메이션 효과 (켜고 끄기·속도는 아래 JS 맨 위 ANIM 설정에서) */
.bb.anim{animation:boxIn .55s cubic-bezier(.2,1.4,.4,1) both;animation-delay:.1s;transform-origin:center}
@keyframes boxIn{from{opacity:0;transform:scale(1.25)}to{opacity:1;transform:scale(1)}}
.row.anim{opacity:0;animation:rowIn .5s ease forwards;animation-delay:var(--d,0ms)}
@keyframes rowIn{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:none}}
</style>
</head>

<!-- ② 화면 구조(HTML) -->
<body>
<div class="wrap">

  <!-- 화면 1: 사진 올리기 -->
  <section id="upload" class="view">
    <p class="tag">YOLO 기반 위장 숨바꼭질</p>
    <h1>숨긴 사진을 올려<br>AI에게 들켜 보세요</h1>
    <p class="sub">캐릭터를 배경에 숨긴 사진을 올리고 제출하면, AI가 찾아서 점수를 매겨 줍니다.</p>

    <div class="drop" id="drop">
      <div style="font-size:40px">📷</div>
      <p style="margin:6px 0;font-weight:700">사진을 끌어다 놓거나 눌러서 선택하세요</p>
      <p class="info" style="margin:0">JPG · PNG · WEBP, 최대 10MB</p>
      <input type="file" id="file" accept="image/jpeg,image/png,image/webp" hidden>
    </div>

    <div id="pv" hidden style="margin-top:16px">
      <div class="panel">
        <div class="preview"><img id="img" alt="미리보기"></div>
        <p class="info" id="meta" style="margin:10px 0 0"></p>
      </div>
    </div>

    <div class="err" id="err"></div>
    <button class="btn or" id="submit" disabled>제출하고 평가받기</button>
    <button class="btn ghost" id="clear" hidden>사진 바꾸기</button>
  </section>

  <!-- 화면 2: 결과 -->
  <section id="result" class="view" hidden>
    <p class="tag">결과</p>
    <h2>평가받기</h2>
    <div class="panel res">
      <div>
        <div class="preview" id="shot"></div>
        <svg id="radar" viewBox="0 0 320 300" style="width:100%"></svg>
      </div>
      <div>
        <span class="score" id="score">0</span> <span class="info">/ 100점</span><br>
        <span class="badge" id="title"></span>
        <div class="found" id="found"></div>
        <div id="cm"></div>
        <p class="info" id="note"></p>
        <a class="btn" href="#upload">다시 도전</a>
      </div>
    </div>
  </section>

</div>

<!-- ③ 동작(JavaScript) -->
<script>
/* ★ 설정 ★ */
// 백엔드 서버 주소 (맨 끝에 /detect 붙이기). 서버를 켜고 나온 주소로 바꾸세요.
//   내 컴퓨터에서 테스트: 'http://localhost:8000/detect'
//   GitHub Pages(https)에 올릴 때: 'https://...' 로 시작하는 주소만 사용 가능
const API_URL  = 'http://localhost:8000/detect';
const TIMEOUT_SEC = 60;       // YOLO가 오래 걸려도 이 시간까지 기다림
const USE_MOCK = false;       // true: 서버 없이 예시 JSON으로 화면만 확인 / false: 실제 서버 사용
const MOCK_FOUND = true;      // USE_MOCK = true 일 때: true=찾은 경우 예시, false=못 찾은 경우 예시

/* ===== ✨ 애니메이션 설정 (여기 숫자만 바꾸면 됩니다) ===== */
const ANIM = {
  on: true,          // false 로 바꾸면 모든 움직임이 꺼지고 바로 결과가 나옴
  radarDelay: 200,   // 결과 화면이 뜬 뒤 움직임이 시작될 때까지 기다리는 시간 (ms, 1000 = 1초)
  radarMs: 1000,     // 오각형 그래프가 가운데에서 펼쳐지는 시간 (ms)
  ease: 'out',       // 움직임 모양: 'out' = 점점 느려짐 / 'back' = 살짝 튕김 / 'linear' = 일정한 속도
  countUp: true,     // 총점 숫자가 0부터 올라감
  countMs: 1000,     // 총점이 올라가는 시간 (ms)
  rows: true,        // 능력치 줄이 하나씩 나타남
  rowStagger: 120,   // 줄과 줄 사이 간격 (ms)
  box: true          // AI가 찾은 박스가 톡 하고 나타남
};
// 컴퓨터 설정에서 '동작 줄이기'를 켠 사람에게는 자동으로 끔
if (typeof matchMedia === 'function' && matchMedia('(prefers-reduced-motion: reduce)').matches) ANIM.on = false;

const MAX_MB = 10;
const OK = ['image/jpeg','image/png','image/webp'];
const $ = id => document.getElementById(id);
let file = null, objUrl = null, state = {};
class ApiError extends Error {}                          // 서버가 보낸 error.message 를 그대로 보여주기 위한 표시
const esc = t => String(t ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// 능력치 key → 화면에 보여줄 이름 (서버가 준 label 보다 우선. 여기서 자유롭게 바꾸세요)
const LABELS = { evasion:'탐지 회피', color_blend:'색 동화', texture_blend:'질감 동화', exposure:'노출 크기', clutter:'배경 복잡도' };

/* --- 1. 사진 선택 (클릭 / 드래그) --- */
const drop = $('drop'), inp = $('file');
drop.onclick = () => inp.click();
inp.onchange = () => pick(inp.files[0]);
['dragenter','dragover'].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave','drop'].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', e => pick(e.dataTransfer.files[0]));

function pick(f){
  $('err').textContent = '';
  if (!f) return;
  if (!OK.includes(f.type)) { $('err').textContent = 'JPG, PNG, WEBP 사진만 올릴 수 있어요.'; return; }
  if (f.size > MAX_MB*1024*1024) { $('err').textContent = `사진이 너무 커요. ${MAX_MB}MB 이하로 올려 주세요.`; return; }
  file = f;
  if (objUrl) URL.revokeObjectURL(objUrl);
  objUrl = URL.createObjectURL(f);
  const im = $('img'); im.src = objUrl;
  im.onload = () => {
    state.w = im.naturalWidth; state.h = im.naturalHeight;
    $('meta').textContent = `${f.name} · ${state.w}×${state.h} · ${(f.size/1048576).toFixed(1)}MB`;
  };
  $('pv').hidden = false; drop.hidden = true;
  $('clear').hidden = false; $('submit').disabled = false;
}

$('clear').onclick = () => {
  file = null; inp.value = '';
  $('pv').hidden = true; drop.hidden = false;
  $('clear').hidden = true; $('submit').disabled = true; $('err').textContent = '';
};

/* --- 2. 제출 (서버로 사진 보내기) --- */
$('submit').onclick = async () => {
  if (!file) return;
  const b = $('submit');
  b.disabled = true; b.innerHTML = '<span class="spin"></span>AI가 찾는 중…';
  $('err').textContent = '';
  let data;
  try {
    if (USE_MOCK) {
      await new Promise(r => setTimeout(r, 900));
      data = mockResult();
    } else {
      const fd = new FormData();
      fd.append('image', file);                       // 서버에서는 'image' 이름으로 받음
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), TIMEOUT_SEC * 1000);
      try {
        const res = await fetch(API_URL, {
          method: 'POST', body: fd, signal: ctrl.signal,
          headers: { 'ngrok-skip-browser-warning': 'true' }   // ngrok 무료 주소 사용 시 필요
        });
        let body = null;
        try { body = await res.json(); } catch (_) {}         // 서버가 준 JSON 값
        data = toData(res.ok, res.status, body);              // 오류 확인 + 두 가지 형식을 하나로 통일
      } finally { clearTimeout(timer); }
    }
  } catch (e) {
    // 실패하면 가짜 결과로 덮지 않고 이유를 보여줌
    $('err').textContent = e.name === 'AbortError'
      ? `서버 응답이 ${TIMEOUT_SEC}초 안에 오지 않았어요. 잠시 후 다시 시도해 주세요.`
      : e instanceof ApiError
        ? e.message
        : '서버에 연결하지 못했어요. 서버가 켜져 있는지, 코드의 API_URL 주소가 맞는지 확인해 주세요.';
    b.disabled = false; b.textContent = '제출하고 평가받기';
    return;
  }
  state.data = data; state.src = objUrl;
  b.disabled = false; b.textContent = '제출하고 평가받기';
  location.hash = 'result';
};

/* --- 서버 응답을 화면이 쓰는 한 가지 형식으로 통일 ---
   ① 점수 스키마 v0.1 : found / detection / abilities(배열)            → 그대로 사용
   ② 예전 형식(app.py) : objects / bbox / abilities(딕셔너리) / comments → 스키마 모양으로 변환 */
const validBox = b => Array.isArray(b) && b.length === 4 && b.every(Number.isFinite);

function normalize(d){
  if (d.detection !== undefined || Array.isArray(d.abilities)) {
    return { ...d, found: typeof d.found === 'boolean' ? d.found : !!d.detection, others: [] };
  }
  let objs = (d.objects && d.objects.length) ? d.objects
           : (d.bbox ? [{ class_name:'', confidence:d.confidence, bbox:d.bbox }] : []);
  objs = objs.filter(o => validBox(o.bbox)).sort((a, b) => b.confidence - a.confidence);
  const found = typeof d.found === 'boolean' ? d.found : objs.length > 0;
  const top = found ? (objs[0] || null) : null;
  const ab = d.abilities || {};
  return {
    schema_version: 'legacy', found,
    image: Array.isArray(d.image_size) ? { width:d.image_size[0], height:d.image_size[1] } : undefined,
    detection: top ? { bbox:top.bbox, confidence:top.confidence } : null,
    others: found ? objs.slice(1) : [],                              // 대표 박스 외에 찾은 것들
    total_score: found ? (d.total_score ?? null) : null,             // 못 찾으면 0점 대신 '-'
    title: found ? (d.title || null) : null,
    abilities: Object.keys(ab).map(name => {
      const v = ab[name], sc = (v && typeof v === 'object') ? v.score : v;
      return { key:name, label:name, score:(found && Number.isFinite(sc)) ? sc : null,
               comment:(d.comments && d.comments[name]) || '' };
    }),
    meta: { model: d.model }
  };
}

function toData(ok, status, body){
  const em = body && body.error && (typeof body.error === 'string' ? body.error : body.error.message);
  if (!ok || (body && body.success === false)) throw new ApiError(em || '서버 오류 (' + status + ')');
  if (!body || typeof body !== 'object' ||
      !['found','objects','bbox','detection','abilities','total_score'].some(k => k in body))
    throw new ApiError('서버 응답 형식을 알 수 없어요. (found / objects / abilities 가 없음)');
  return normalize(body);
}

/* 점수 스키마(v0.1) 예시 JSON (USE_MOCK = true 일 때만 사용) */
function mockResult(){
  const image = { width: state.w || 1390, height: state.h || 781 };
  const keys = ['evasion','color_blend','texture_blend','exposure','clutter'];
  if (!MOCK_FOUND) {
    return { schema_version:'0.1', found:false, image, detection:null, total_score:null, title:null,
      abilities: keys.map(key => ({ key, label: LABELS[key], score:null, comment:'' })),
      elapsed_sec:null, meta:{ model:'best_v1.pt', inference_ms:38.2, conf_threshold:0.25 } };
  }
  const w = image.width, h = image.height;
  return { schema_version:'0.1', found:true, image,
    detection:{ bbox:[w*.3, h*.22, w*.39, h*.39], confidence:0.87 },
    total_score:50, title:'아쉬운 견습 카멜레온',
    abilities:[
      { key:'evasion',       label:'탐지 회피',   score:13, comment:'AI가 바로 찾았어요.' },
      { key:'color_blend',   label:'색 동화',     score:72, comment:'주변 색과 잘 어울려요.' },
      { key:'texture_blend', label:'질감 동화',   score:58, comment:'무늬가 조금 튀어요.' },
      { key:'exposure',      label:'노출 크기',   score:40, comment:'몸이 꽤 크게 보여요.' },
      { key:'clutter',       label:'배경 복잡도', score:66, comment:'복잡한 곳을 잘 골랐어요.' } ],
    elapsed_sec:null, meta:{ model:'best_v1.pt', inference_ms:41.5, conf_threshold:0.25 } };
}

/* ===== ✨ 애니메이션 함수 ===== */
const EASE = {                                                        // 0~1 진행도를 움직임 곡선으로 바꿔 줌
  out:    t => 1 - Math.pow(1 - t, 3),
  back:   t => 1 + 2.70158 * Math.pow(t - 1, 3) + 1.70158 * Math.pow(t - 1, 2),
  linear: t => t
};
let radarRaf = 0, scoreRaf = 0;

// 총점 숫자: 0 → 점수까지 올라감
function showScore(total){
  cancelAnimationFrame(scoreRaf);
  const el = $('score');
  if (!(ANIM.on && ANIM.countUp) || !Number.isFinite(total)) { el.textContent = total ?? '-'; return; }
  el.textContent = 0;
  const t0 = performance.now() + ANIM.radarDelay;
  const step = now => {
    const p = Math.max(0, Math.min(1, (now - t0) / ANIM.countMs));
    el.textContent = Math.round(total * EASE.out(p));
    if (p < 1) scoreRaf = requestAnimationFrame(step);
  };
  scoreRaf = requestAnimationFrame(step);
}

// 오각형 그래프: 가운데에서 점수만큼 펼쳐짐 (k=이름들, v=점수들(0~100), sc=화면에 쓸 점수 글자)
function drawRadar(k, v, sc){
  const cx = 160, cy = 150, R = 105, n = k.length;
  const at = (i, f) => { const t = -Math.PI/2 + i*2*Math.PI/n; return [cx + Math.cos(t)*R*f, cy + Math.sin(t)*R*f]; };
  const ring = f => k.map((_, i) => at(i, f).join(',')).join(' ');
  let g = '';
  [.25,.5,.75,1].forEach(f => g += `<polygon points="${ring(f)}" fill="none" stroke="#cfc9b6"/>`);   // 바탕 오각형
  g += `<polygon class="rdPoly" fill="rgba(107,131,80,.4)" stroke="#3f5c2b" stroke-width="2.5" stroke-linejoin="round"/>`;  // 점수 모양
  k.forEach(() => g += `<circle class="rdDot" r="4" fill="#3f5c2b"/>`);                                // 꼭짓점 점
  k.forEach((name, i) => { const q = at(i, 1.22);                                                     // 항목 이름
    g += `<text class="rdLabel" x="${q[0]}" y="${q[1]}" text-anchor="middle" font-size="12" fill="#1f2a1f">${esc(name)} ${sc[i]}</text>`; });
  const svg = $('radar'); svg.innerHTML = g;

  const poly = svg.querySelector('.rdPoly'), dots = svg.querySelectorAll('.rdDot'), labels = svg.querySelectorAll('.rdLabel');
  const setT = t => {                                                                                 // t: 0(가운데) ~ 1(완성)
    const pts = k.map((_, i) => at(i, v[i] / 100 * t));
    poly.setAttribute('points', pts.map(q => q.join(',')).join(' '));
    dots.forEach((d, i) => { d.setAttribute('cx', pts[i][0]); d.setAttribute('cy', pts[i][1]); });
    labels.forEach(l => l.setAttribute('opacity', Math.min(1, t * 2)));                              // 이름은 서서히 나타남
  };

  cancelAnimationFrame(radarRaf);
  if (!ANIM.on) { setT(1); return; }
  setT(0);
  const t0 = performance.now() + ANIM.radarDelay;
  const step = now => {
    const p = Math.max(0, Math.min(1, (now - t0) / ANIM.radarMs));
    setT((EASE[ANIM.ease] || EASE.out)(p));
    if (p < 1) radarRaf = requestAnimationFrame(step);
  };
  radarRaf = requestAnimationFrame(step);
}

/* --- 3. 결과 그리기 (서버가 준 점수 스키마 JSON을 화면에 표시) --- */
function renderResult(){
  const d = state.data;
  if (!d) { location.hash = 'upload'; return; }
  const det = d.found ? d.detection : null;                 // 못 찾았으면 null

  // 사진 + 대표 박스 1개 (bbox 는 원본 사진 기준 픽셀 좌표)
  const s = $('shot'); s.innerHTML = '';
  const im = document.createElement('img');
  im.src = state.src; im.style.cssText = 'width:100%;display:block'; s.appendChild(im);
  const place = () => {
    const W = (d.image && d.image.width)  || im.naturalWidth  || state.w;
    const H = (d.image && d.image.height) || im.naturalHeight || state.h;
    [det, ...(d.others || [])].forEach((o, i) => {                  // 첫 번째 = 대표 박스(주황)
      const [x1,y1,x2,y2] = o.bbox;
      const bx = document.createElement('div'); bx.className = 'bb' + (i ? ' sub' : '') + (ANIM.on && ANIM.box ? ' anim' : '');
      bx.style.cssText = `left:${x1/W*100}%;top:${y1/H*100}%;width:${(x2-x1)/W*100}%;height:${(y2-y1)/H*100}%`;
      const name = i ? (esc(o.class_name) || '기타') + ' ' : '탐지 신뢰도 ';
      bx.innerHTML = `<span>${name}${Number(o.confidence).toFixed(2)}</span>`;
      s.appendChild(bx);
    });
  };
  if (det) { im.complete ? place() : im.onload = place; }

  // 총점, 칭호 (못 찾았으면 null → '-')
  showScore(d.total_score);                                 // 총점 (카운트업 효과)
  $('title').textContent = d.title || '';
  $('title').hidden = !d.title;

  // 찾았는지 한 줄 안내
  const extra = (d.others || []).length;
  $('found').textContent = det
    ? `AI가 캐릭터를 찾았어요 (신뢰도 ${Number(det.confidence).toFixed(2)})` + (extra ? ` · 그 밖에 ${extra}개를 더 찾았어요` : '')
    : d.found ? 'AI가 찾았다고 했지만 위치 정보를 읽지 못했어요.'
    : 'AI가 캐릭터를 찾지 못했어요. 정말 잘 숨었을 수도, 사진에 캐릭터가 없을 수도 있어요.';

  // 능력치: 배열 순서 = 차트 순서. score 가 null 이면 숫자는 '-', 그래프는 0
  const items = (d.abilities || []).map(a => ({
    label: LABELS[a.key] || a.label || a.key, score: a.score, comment: a.comment || ''
  }));
  $('cm').innerHTML = items.map((a, i) =>
    `<div class="row${ANIM.on && ANIM.rows ? ' anim' : ''}" style="--d:${ANIM.radarDelay + i * ANIM.rowStagger}ms"><b>${esc(a.label)}</b><span>${a.score ?? '-'}${a.comment ? ' · ' + esc(a.comment) : ''}</span></div>`).join('');

  // 오각형(레이더) 그래프: 움직임은 drawRadar() 안에 있음
  const k = items.map(a => a.label), v = items.map(a => a.score ?? 0), sc = items.map(a => a.score ?? '-');
  $('radar').hidden = items.length < 3;
  if (items.length >= 3) drawRadar(k, v, sc);

  // 안내 문구: 아직 전용 모델(best) 전이면 알려줌
  const m = d.meta && d.meta.model;
  $('note').textContent = (m && /\.pt$/i.test(m) && !/best/i.test(m))
    ? `※ 아직 캐릭터 전용 모델(best.pt) 전이라, 기본 모델(${m}) 기준 결과예요.` : '';
}

/* --- 4. 화면 전환 (주소 뒤 #upload / #result) --- */
function route(){
  const h = location.hash.slice(1) === 'result' ? 'result' : 'upload';
  document.querySelectorAll('.view').forEach(e => e.hidden = e.id !== h);
  if (h === 'result') renderResult();
  window.scrollTo(0, 0);
}
addEventListener('hashchange', route);
route();
</script>
</body>
